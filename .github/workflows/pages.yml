name: Cloudflare Pages

# Reusable: build a static site and deploy it to a Cloudflare Pages project.
# Pull requests build only (they don't get the deploy secrets); pushes and
# manual runs deploy. wrangler runs through npx and is never installed into
# the caller's project, so the project's peer-dependency quirks can't break
# the deploy step.

on:
  workflow_call:
    inputs:
      project:
        description: Cloudflare Pages project name
        type: string
        required: true
      account-id:
        description: Cloudflare account ID (or pass the CLOUDFLARE_ACCOUNT_ID secret)
        type: string
        default: ''
      directory:
        description: Build output directory, relative to working-directory
        type: string
        default: dist
      working-directory:
        type: string
        default: .
      node-version:
        type: string
        default: '22'
      install-command:
        type: string
        default: npm ci
      build-command:
        type: string
        default: npm run build
      build-env:
        description: Extra non-secret build variables, one KEY=value per line
        type: string
        default: ''
      production-branch:
        type: string
        default: main
      wrangler-version:
        type: string
        default: '4'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      url:
        description: Deployment URL (empty when nothing was deployed)
        value: ${{ jobs.pages.outputs.url }}

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || inputs.account-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install
        run: ${{ inputs.install-command }}

      - name: Build
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          if [ -n "$BUILD_ENV" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && export "$line"
            done <<< "$BUILD_ENV"
          fi
          ${{ inputs.build-command }}

      - name: Deploy
        id: deploy
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          PROJECT: ${{ inputs.project }}
          DIRECTORY: ${{ inputs.directory }}
          PRODUCTION_BRANCH: ${{ inputs.production-branch }}
          WRANGLER: wrangler@${{ inputs.wrangler-version }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Pass account-id or the CLOUDFLARE_ACCOUNT_ID secret."; exit 1
          fi
          # A fresh account has no project yet; pages deploy won't create one.
          if ! npx --yes "$WRANGLER" pages project list | grep -qw -- "$PROJECT"; then
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch="$PRODUCTION_BRANCH"
          fi
          npx --yes "$WRANGLER" pages deploy "$DIRECTORY" --project-name="$PROJECT" --branch="$GITHUB_REF_NAME" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed **$PROJECT** ($GITHUB_REF_NAME): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Say why nothing deployed
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::No CLOUDFLARE_API_TOKEN secret, so the site was built but not deployed."
